<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="ufuksamet0 hero">
<style>
.bg{fill:#FAF6EF}.ink{fill:#1A1815}.muted{fill:#6B6259}
.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.rise{opacity:0;transform:translateY(18px);animation:rise .9s ease-out forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.shine{animation:sweep 3.2s ease-in-out 1.2s infinite}
@keyframes sweep{0%{transform:translateX(-240px) skewX(-18deg);opacity:0}15%{opacity:1}50%{transform:translateX(240px) skewX(-18deg);opacity:1}70%,100%{transform:translateX(420px) skewX(-18deg);opacity:0}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.shine,.cursor{animation:none;opacity:1;transform:none}}
</style>
<rect x="4" y="4" width="1192" height="332" rx="22" class="bg" stroke="#1A1815" stroke-width="3"/>
<g>
<text x="64" y="110" font-size="30" class="sans muted rise d1" letter-spacing="3">FULL-STACK BUILDER — TS / PYTHON / RUST</text>
<text x="60" y="185" font-size="78" font-weight="700" class="serif ink rise d2">@ufuksamet0</text>
<clipPath id="nameClip"><text x="60" y="185" font-size="78" font-weight="700" class="serif">@ufuksamet0</text></clipPath>
<g clip-path="url(#nameClip)"><rect x="60" y="120" width="90" height="80" fill="#2E7CF6" opacity=".35" class="shine"/></g>
<text x="64" y="235" font-size="26" class="sans muted rise d3">portfolio-grade, testable deliveries: backend / API / data + frontend / UX</text>
<g class="sans rise d4" font-size="22">
<rect x="64" y="262" width="150" height="40" rx="20" fill="#2E7CF6"/><text x="139" y="289" text-anchor="middle" fill="#fff">BUILD</text>
<rect x="226" y="262" width="160" height="40" rx="20" fill="#E4572E"/><text x="306" y="289" text-anchor="middle" fill="#fff">TRADE</text>
<rect x="398" y="262" width="160" height="40" rx="20" fill="#E8B306"/><text x="478" y="289" text-anchor="middle" fill="#1A1815">LEARN</text>
<text x="580" y="289" class="muted">portfolio --ship-small</text>
</g>
</g>
<g transform="translate(1020,70) rotate(8)">
<rect width="130" height="130" rx="18" fill="none" stroke="#E4572E" stroke-width="3" stroke-dasharray="8 6"/>
<text x="65" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#E4572E" class="sans">SHIP</text>
<text x="65" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#E4572E" class="sans">SMALL</text>
<text x="65" y="110" text-anchor="middle" font-size="15" fill="#E4572E" class="sans">docs + tests</text>
</g>
</svg>