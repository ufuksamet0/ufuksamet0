<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<style>.sans{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}.serif{font-family:Georgia,serif}
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow 1s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cell{opacity:0;animation:cellIn .3s ease-out forwards}
@keyframes cellIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bar,.cell{animation:none;opacity:1}}</style>
<rect x="4" y="4" width="1192" height="272" rx="22" fill="#FAF6EF" stroke="#1A1815" stroke-width="3"/>
<text x="40" y="52" font-size="26" font-weight="700" class="serif" fill="#1A1815">Monthly activity — last 12 months</text>
<text x="40" y="76" font-size="15" class="sans" fill="#6B6259">bars grow bottom-up - best month in brand blue</text>
<g font-size="13" text-anchor="middle" class="sans" fill="#6B6259">
<rect x="50" y="190" width="48" height="40" rx="6" fill="#2E7CF6" opacity=".25" class="bar" style="animation-delay:.3s"/>
<rect x="112" y="180" width="48" height="50" rx="6" fill="#2E7CF6" opacity=".3" class="bar" style="animation-delay:.35s"/>
<rect x="174" y="185" width="48" height="45" rx="6" fill="#2E7CF6" opacity=".28" class="bar" style="animation-delay:.4s"/>
<rect x="236" y="172" width="48" height="58" rx="6" fill="#2E7CF6" opacity=".35" class="bar" style="animation-delay:.45s"/>
<rect x="298" y="165" width="48" height="65" rx="6" fill="#2E7CF6" opacity=".42" class="bar" style="animation-delay:.5s"/>
<rect x="360" y="175" width="48" height="55" rx="6" fill="#2E7CF6" opacity=".35" class="bar" style="animation-delay:.55s"/>
<rect x="422" y="160" width="48" height="70" rx="6" fill="#2E7CF6" opacity=".5" class="bar" style="animation-delay:.6s"/>
<rect x="484" y="150" width="48" height="80" rx="6" fill="#2E7CF6" opacity=".6" class="bar" style="animation-delay:.65s"/>
<rect x="546" y="155" width="48" height="75" rx="6" fill="#2E7CF6" opacity=".55" class="bar" style="animation-delay:.7s"/>
<rect x="608" y="145" width="48" height="85" rx="6" fill="#2E7CF6" opacity=".7" class="bar" style="animation-delay:.75s"/>
<rect x="670" y="150" width="48" height="80" rx="6" fill="#2E7CF6" opacity=".62" class="bar" style="animation-delay:.8s"/>
<rect x="732" y="110" width="48" height="120" rx="6" fill="#2E7CF6" class="bar" style="animation-delay:.9s"/>
</g>
<g><text x="830" y="120" font-size="18" font-weight="700" class="sans" fill="#1A1815">coded - CoinTrade - TrainGit</text>
<g fill="#2E7CF6">
<rect x="830" y="135" width="18" height="18" rx="4" class="cell" style="animation-delay:.5s"/>
<rect x="852" y="135" width="18" height="18" rx="4" class="cell" style="animation-delay:.55s"/>
<rect x="874" y="135" width="18" height="18" rx="4" class="cell" style="animation-delay:.6s" opacity=".6"/>
<rect x="896" y="135" width="18" height="18" rx="4" class="cell" style="animation-delay:.65s"/>
<rect x="918" y="135" width="18" height="18" rx="4" class="cell" style="animation-delay:.7s"/>
<rect x="830" y="157" width="18" height="18" rx="4" class="cell" style="animation-delay:.75s"/>
<rect x="852" y="157" width="18" height="18" rx="4" class="cell" style="animation-delay:.8s"/>
<rect x="874" y="157" width="18" height="18" rx="4" class="cell" style="animation-delay:.85s"/>
<rect x="896" y="157" width="18" height="18" rx="4" class="cell" style="animation-delay:.9s" opacity=".6"/>
<rect x="918" y="157" width="18" height="18" rx="4" class="cell" style="animation-delay:.95s"/>
</g>
<text x="830" y="200" font-size="14" class="sans" fill="#6B6259">blue graph = brand, not green default</text>
<text x="830" y="220" font-size="14" class="sans" fill="#6B6259">daily refresh via Action (next step)</text>
</g>
</svg>